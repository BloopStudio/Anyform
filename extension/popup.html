<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Anyform</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <header class="app-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m17 2 4 4-4 4" />
          <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
          <path d="m7 22-4-4 4-4" />
          <path d="M21 13v1a4 4 0 0 1-4 4H3" />
        </svg>
      </div>
      <div>
        <h1>Anyform</h1>
        <p class="subtitle" data-i18n="header.subtitleExt">100% local, rien n'est envoyé sur internet</p>
      </div>
      <div id="langSwitch" class="lang-switch" role="group" aria-label="Langue / Language">
        <button type="button" id="langFr" class="lang-btn" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" id="langEn" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <div class="field">
      <div id="modeTabs" class="tabs mode-tabs" role="tablist" aria-label="Mode">
        <button type="button" class="tab is-active" data-mode="convert" role="tab" aria-selected="true" data-i18n="mode.convert">Convertisseur</button>
        <button type="button" class="tab" data-mode="compress" role="tab" aria-selected="false" data-i18n="mode.compress">Compresseur</button>
        <button type="button" class="tab" data-mode="inspect" role="tab" aria-selected="false" data-i18n="mode.inspect">Inspecteur</button>
        <button type="button" class="tab" data-mode="compare" role="tab" aria-selected="false" data-i18n="mode.compare">Comparateur</button>
      </div>
    </div>

    <div id="categoryField" class="field">
      <span class="field-label" data-i18n="category.label">Type de fichier</span>
      <div id="categoryTabs" class="tabs" role="tablist" aria-label="Type de fichier">
        <button type="button" class="tab is-active" data-category="image" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.1-3.1a2 2 0 0 0-2.814.014L6 21" /></svg>
          <span data-i18n="category.image">Image</span>
        </button>
        <button type="button" class="tab" data-category="data" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" /><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9h18" /><path d="M3 15h18" /></svg>
          <span data-i18n="category.data">Données</span>
        </button>
        <button type="button" class="tab" data-category="audio" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
          <span data-i18n="category.audio">Audio</span>
        </button>
        <button type="button" class="tab" data-category="video" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" /><rect x="2" y="6" width="14" height="12" rx="2" /></svg>
          <span data-i18n="category.video">Vidéo</span>
        </button>
        <button type="button" class="tab" data-category="subtitle" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="14" x="3" y="5" rx="2" /><path d="M7 15h4" /><path d="M15 15h2" /><path d="M7 10h10" /></svg>
          <span data-i18n="category.subtitle">Sous-titres</span>
        </button>
        <button type="button" class="tab" data-category="document" role="tab" aria-selected="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" /><path d="M14 2v6h6" /></svg>
          <span data-i18n="category.document">Document</span>
        </button>
      </div>
    </div>

    <div id="formatRow" class="format-row">
      <div class="field">
        <label for="sourceFormat" data-i18n="field.sourceFormat">Format d'entrée</label>
        <select id="sourceFormat">
          <option value="svg">SVG</option>
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="webp">WebP</option>
          <option value="gif">GIF</option>
          <option value="bmp">BMP</option>
          <option value="heic">HEIC</option>
        </select>
      </div>
      <div class="format-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </div>
      <div class="field">
        <label for="format" data-i18n="field.outputFormat">Format de sortie</label>
        <select id="format">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
          <option value="webp">WebP</option>
          <option value="avif">AVIF</option>
          <option value="ico">ICO</option>
          <option value="tiff">TIFF</option>
        </select>
      </div>
    </div>

    <div id="compressionRow" class="field" hidden>
      <label for="compressionLevel" data-i18n="field.compressionLevel">Niveau de compression</label>
      <select id="compressionLevel">
        <option value="light" data-i18n="compression.light">Léger — qualité quasi identique</option>
        <option value="medium" selected data-i18n="compression.medium">Moyen — bon compromis</option>
        <option value="strong" data-i18n="compression.strong">Fort — fichier le plus léger</option>
      </select>
    </div>

    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choisir un fichier à convertir" data-i18n-aria-label="dropzone.single.aria">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M12 12v9" /><path d="m16 16-4-4-4 4" /></svg>
      <p class="dropzone-text" data-i18n="dropzone.single">Glisse un fichier ici ou clique pour en choisir un</p>
      <input id="fileInput" type="file" hidden />
      <p id="fileName" class="filename"></p>
    </div>

    <div id="compareDropzones" class="compare-dropzones" hidden>
      <div id="dropzoneA" class="dropzone" tabindex="0" role="button" aria-label="Choisir le premier fichier" data-i18n-aria-label="dropzone.fileA.aria">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M12 12v9" /><path d="m16 16-4-4-4 4" /></svg>
        <p class="dropzone-text" data-i18n="dropzone.fileA">Fichier A</p>
        <input id="fileInputA" type="file" hidden />
        <p id="fileNameA" class="filename"></p>
      </div>
      <div id="dropzoneB" class="dropzone" tabindex="0" role="button" aria-label="Choisir le second fichier" data-i18n-aria-label="dropzone.fileB.aria">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" /><path d="M12 12v9" /><path d="m16 16-4-4-4 4" /></svg>
        <p class="dropzone-text" data-i18n="dropzone.fileB">Fichier B</p>
        <input id="fileInputB" type="file" hidden />
        <p id="fileNameB" class="filename"></p>
      </div>
    </div>

    <div id="previewRow" class="preview-row" hidden>
      <div class="preview-box">
        <span class="preview-label" data-i18n="preview.original">Original</span>
        <img id="previewBefore" alt="Aperçu du fichier original" data-i18n-alt="preview.before.alt" />
      </div>
      <div class="preview-arrow" aria-hidden="true">→</div>
      <div class="preview-box">
        <span class="preview-label" data-i18n="preview.result">Résultat</span>
        <img id="previewAfter" alt="Aperçu du fichier converti" data-i18n-alt="preview.after.alt" />
      </div>
    </div>


    <button id="convertBtn" class="convert-btn" disabled>
      <span class="btn-spinner" aria-hidden="true"></span>
      <span class="btn-label" data-i18n="mode.convert.btn">Convertir</span>
    </button>

    <div id="progressWrap" class="progress-wrap" hidden>
      <div class="progress-track"><div id="progressBar" class="progress-fill"></div></div>
      <p id="progressLabel" class="progress-label"></p>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="resultCard" class="result-card" hidden role="status">
      <svg class="result-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m9 11 3 3L22 4" /></svg>
      <div class="result-info">
        <p id="resultName" class="result-name"></p>
        <p id="resultMeta" class="result-meta"></p>
      </div>
      <div class="result-actions">
        <button id="downloadBtn" type="button" class="btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></svg>
          <span data-i18n="btn.download">Télécharger</span>
        </button>
        <button id="resetBtn" type="button" class="btn-ghost"><span data-i18n="btn.newFile">Nouveau fichier</span></button>
      </div>
    </div>

    <div id="inspectResult" class="inspect-result" hidden>
      <dl id="inspectList" class="inspect-list"></dl>
    </div>

    <div id="compareResult" class="compare-result" hidden></div>

    <div id="historySection" class="history-section" hidden>
      <div class="history-header">
        <span class="field-label" data-i18n="history.label">Historique récent</span>
        <button id="clearHistoryBtn" type="button" class="btn-ghost btn-small"><span data-i18n="btn.clear">Vider</span></button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </div>

    <p class="footer">Anyform v1.0.25 — <span data-i18n="footer.by">par BloopStudio</span></p>
  </main>

  <script src="i18n.js"></script>
  <script src="vendor/imagetracer.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/heic2any.min.js"></script>
  <script src="vendor/utif.js"></script>
  <script src="convert.js"></script>
  <script src="data.js"></script>
  <script src="ffmpeg-engine.js"></script>
  <script src="audio.js"></script>
  <script src="video.js"></script>
  <script src="compress.js"></script>
  <script src="subtitles.js"></script>
  <script src="history.js"></script>
  <script src="inspect.js"></script>
  <script src="compare.js"></script>
  <script src="popup.js"></script>
</body>
</html>
