<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Anyform</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <h1>Anyform</h1>
    <p class="subtitle">Images, données, audio, vidéo — 100% local, rien n'est envoyé sur internet</p>

    <div class="controls">
      <label for="category">Type de fichier :</label>
      <select id="category">
        <option value="image">Image</option>
        <option value="data">Données</option>
        <option value="audio">Audio</option>
        <option value="video">Vidéo</option>
      </select>
    </div>

    <div class="controls">
      <label for="sourceFormat">Format d'entrée :</label>
      <select id="sourceFormat">
        <option value="svg">SVG</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
        <option value="gif">GIF</option>
        <option value="bmp">BMP</option>
        <option value="heic">HEIC</option>
      </select>
    </div>

    <div class="controls">
      <label for="format">Format de sortie :</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
        <option value="ico">ICO</option>
        <option value="tiff">TIFF</option>
      </select>
    </div>

    <div id="dropzone" class="dropzone">
      <p>Glisse un fichier ici ou clique pour en choisir un</p>
      <input id="fileInput" type="file" hidden />
      <p id="fileName" class="filename"></p>
    </div>

    <div id="previewRow" class="preview-row" hidden>
      <div class="preview-box">
        <span class="preview-label">Original</span>
        <img id="previewBefore" alt="Aperçu du fichier original" />
      </div>
      <div class="preview-arrow">→</div>
      <div class="preview-box">
        <span class="preview-label">Résultat</span>
        <img id="previewAfter" alt="Aperçu du fichier converti" />
      </div>
    </div>

    <div id="scaleRow" class="controls">
      <label for="scale">Échelle (pour SVG en entrée) :</label>
      <select id="scale">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="4">4x</option>
      </select>
    </div>

    <div class="controls">
      <button id="convertBtn" disabled>Convertir</button>
    </div>

    <p id="status" class="status"></p>

    <p class="footer">Anyform v1.0.1 — par BloopStudio</p>
  </main>

  <script src="vendor/imagetracer.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/heic2any.min.js"></script>
  <script src="vendor/utif.js"></script>
  <script src="convert.js"></script>
  <script src="data.js"></script>
  <script src="ffmpeg-engine.js"></script>
  <script src="audio.js"></script>
  <script src="video.js"></script>
  <script src="popup.js"></script>
</body>
</html>
