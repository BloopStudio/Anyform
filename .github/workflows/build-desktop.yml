name: Construire l'app de bureau

on:
  push:
    branches: [desktop-app]
    paths:
      - "main.js"
      - "preload.js"
      - "public/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

# Empêche deux runs de tourner en même temps : sans ça, deux releases publiées à quelques
# secondes d'intervalle peuvent chacune calculer leurs notes de version par rapport à la même
# "dernière release" (celle de l'autre n'existe pas encore à ce moment-là), et donc lister les
# mêmes commits en double. Mis en file d'attente plutôt qu'annulé (pas de cancel-in-progress)
# pour ne pas interrompre un build/publication déjà lancé.
concurrency:
  group: build-desktop

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrémenter le patch de package.json
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-exe
          - os: macos-latest
            artifact: macos-dmg
          - os: ubuntu-latest
            artifact: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      # On repart de la HEAD de la branche (pas du commit qui a déclenché le run) pour
      # embarquer le numéro de version tout juste incrémenté par le job "bump" ci-dessus.
      - uses: actions/checkout@v4
        with:
          ref: desktop-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Injecter le numéro de version dans index.html
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const { version } = require('./package.json');
            const path = 'public/index.html';
            let html = fs.readFileSync(path, 'utf8');
            html = html.replaceAll('__APP_VERSION__', version);
            html = html.replaceAll('__BUILD_ID__', '${GITHUB_SHA}'.slice(0, 8));
            fs.writeFileSync(path, html);
          "

      - run: npm ci

      - name: Construire l'installateur
        run: npm run dist
        env:
          # Pas de certificat de signature disponible : on désactive la recherche
          # automatique pour que le build ne plante pas sur macOS/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publier les artefacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: anyform-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Comme pour le job "build", on repart de la HEAD de la branche (pas du commit qui a
      # déclenché le run) pour lire le numéro de version tout juste incrémenté par "bump".
      # fetch-depth: 0 + fetch-tags (historique complet + tags) est nécessaire pour que
      # "git log <tag précédent>..HEAD" puisse générer les notes de version ci-dessous.
      - uses: actions/checkout@v4
        with:
          ref: desktop-app
          fetch-depth: 0
          fetch-tags: true

      - name: Lire le numéro de version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: anyform-*
          path: artifacts
          merge-multiple: true

      - name: Générer les notes de version depuis la dernière release
        run: |
          # Le tag précédent vient de l'ascendance git de HEAD (pas de "gh release list", ni
          # d'un tri par date de tag) : "git describe" remonte l'historique des commits pour
          # trouver le tag le plus proche, ce qui reste fiable même quand deux tags sont créés
          # à la même seconde (les tags légers n'ont pas de date propre : un tri par date
          # retombe sur la date du commit visé, ex-aequo en CI rapide, et peut piocher le
          # mauvais tag — vu en pratique, ça faisait ressortir des commits déjà publiés).
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          MAX_ENTRIES=25

          {
            echo "## Ce qui a changé"
            echo

            if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s (%h)' \
                | grep -v '^- chore: bump version' || true)

              if [ -z "$COMMITS" ]; then
                echo "- Corrections et ajustements mineurs."
              else
                TOTAL=$(echo "$COMMITS" | wc -l)
                echo "$COMMITS" | head -n "$MAX_ENTRIES"
                if [ "$TOTAL" -gt "$MAX_ENTRIES" ]; then
                  echo "- … et $((TOTAL - MAX_ENTRIES)) autre(s) commit(s) (voir l'historique complet)."
                fi
              fi
            else
              echo "- Première release publiée automatiquement."
            fi

            echo
            echo
            echo "---"
            echo
            echo "Build automatique, non signé : Windows SmartScreen et macOS Gatekeeper"
            echo "afficheront un avertissement au premier lancement."
          } > release_notes.md

          cat release_notes.md

      - name: Publier la release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Anyform v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          prerelease: false
          make_latest: true
          files: artifacts/*

      - name: Supprimer les releases antérieures à (version publiée - 10)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREFIX="${VERSION%.*}"
          PATCH="${VERSION##*.}"
          THRESHOLD=$((PATCH - 10))

          if [ "$THRESHOLD" -le 0 ]; then
            echo "Version ${VERSION} trop basse pour déclencher un nettoyage (seuil ${THRESHOLD} <= 0)."
            exit 0
          fi

          echo "Suppression des releases ${PREFIX}.x antérieures à ${PREFIX}.${THRESHOLD}"
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | while read -r tag; do
            TAG_VERSION="${tag#v}"
            TAG_PREFIX="${TAG_VERSION%.*}"
            TAG_PATCH="${TAG_VERSION##*.}"
            if [ "$TAG_PREFIX" = "$PREFIX" ] && [[ "$TAG_PATCH" =~ ^[0-9]+$ ]] && [ "$TAG_PATCH" -lt "$THRESHOLD" ]; then
              echo "Suppression de la release obsolète : $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" -y --cleanup-tag
            fi
          done
