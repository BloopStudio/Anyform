name: Construire l'app de bureau

on:
  push:
    branches: [desktop-app]
    paths:
      - "main.js"
      - "preload.js"
      - "public/**"
      - "build/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrémenter le patch de package.json
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-exe
          - os: macos-latest
            artifact: macos-dmg
          - os: ubuntu-latest
            artifact: linux-appimage
    runs-on: ${{ matrix.os }}
    steps:
      # On repart de la HEAD de la branche (pas du commit qui a déclenché le run) pour
      # embarquer le numéro de version tout juste incrémenté par le job "bump" ci-dessus.
      - uses: actions/checkout@v4
        with:
          ref: desktop-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Injecter le numéro de version dans index.html
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const { version } = require('./package.json');
            const path = 'public/index.html';
            let html = fs.readFileSync(path, 'utf8');
            html = html.replaceAll('__APP_VERSION__', version);
            html = html.replaceAll('__BUILD_ID__', '${GITHUB_SHA}'.slice(0, 8));
            fs.writeFileSync(path, html);
          "

      - run: npm ci

      - name: Construire l'installateur
        run: npm run dist
        env:
          # Pas de certificat de signature disponible : on désactive la recherche
          # automatique pour que le build ne plante pas sur macOS/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publier les artefacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: anyform-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anyform-*
          path: artifacts
          merge-multiple: true

      - name: Publier/mettre à jour la release "desktop-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Anyform (build continu)
          body: >
            Build automatique le plus récent de l'app de bureau Anyform à partir de la
            branche `desktop-app` (commit ${{ github.sha }}). Non signé : Windows
            SmartScreen et macOS Gatekeeper afficheront un avertissement au premier
            lancement.
          prerelease: true
          make_latest: false
          files: artifacts/*
