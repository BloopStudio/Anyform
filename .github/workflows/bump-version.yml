name: Publier l'extension

on:
  push:
    branches: [browser-extension]

permissions:
  contents: write
  actions: write

# Empêche deux runs de tourner en même temps : sans ça, deux publications rapprochées
# pourraient chacune incrémenter la version à partir du même manifest.json de départ et se
# marcher dessus.
concurrency:
  group: bump-version-extension

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrémenter le patch de manifest.json
        run: |
          NEW_VERSION=$(node -p "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
            const [major, minor, patch] = m.version.split('.').map(Number);
            m.version = \`\${major}.\${minor}.\${patch + 1}\`;
            fs.writeFileSync('extension/manifest.json', JSON.stringify(m, null, 2) + '\n');
            m.version;
          ")
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Injecter le numéro de version dans popup.html
        run: sed -i "s/__APP_VERSION__/${NEW_VERSION}/g; s/v[0-9]\+\.[0-9]\+\.[0-9]\+ — <span data-i18n=\"footer.by\">/v${NEW_VERSION} — <span data-i18n=\"footer.by\">/g" extension/popup.html

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/popup.html
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

      - name: Empaqueter l'extension
        run: (cd extension && zip -r ../extension.zip . -x "README.md")

      - name: Publier sur le Chrome Web Store
        env:
          CWS_ITEM_ID: emkgiblipknkbnncdfbmnhhpgpmgaeoe
        run: |
          ACCESS_TOKEN=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d client_id="${{ secrets.CWS_CLIENT_ID }}" \
            -d client_secret="${{ secrets.CWS_CLIENT_SECRET }}" \
            -d refresh_token="${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d grant_type=refresh_token | jq -r '.access_token')

          UPLOAD_RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/zip" \
            -T extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_ITEM_ID}")
          echo "$UPLOAD_RESPONSE"
          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | jq -r '.uploadState')
          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "::error::Échec de l'upload sur le Chrome Web Store (uploadState: $UPLOAD_STATE)"
            exit 1
          fi

          PUBLISH_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_ITEM_ID}/publish")
          echo "$PUBLISH_RESPONSE"
          PUBLISH_STATUS=$(echo "$PUBLISH_RESPONSE" | jq -r '.status[0]')
          if [ "$PUBLISH_STATUS" != "OK" ]; then
            echo "::error::Échec de la publication sur le Chrome Web Store (status: $PUBLISH_STATUS)"
            exit 1
          fi

      - name: Supprimer les anciens runs du workflow (garder les 10 derniers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow "bump-version.yml" \
            --json databaseId,createdAt --limit 100 \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].databaseId' | while read -r id; do
            echo "Suppression du run obsolète : $id"
            gh run delete "$id" --repo "${{ github.repository }}" || true
          done
