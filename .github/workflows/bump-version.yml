name: Incrémenter la version

on:
  push:
    branches: [cli-converter]

permissions:
  contents: write
  actions: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Incrémenter le patch de package.json
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push

      - name: Supprimer les anciens runs du workflow (garder les 10 derniers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow "bump-version.yml" \
            --json databaseId,createdAt --limit 100 \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].databaseId' | while read -r id; do
            echo "Suppression du run obsolète : $id"
            gh run delete "$id" --repo "${{ github.repository }}" || true
          done
