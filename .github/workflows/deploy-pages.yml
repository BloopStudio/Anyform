name: Déployer sur GitHub Pages

on:
  push:
    branches: [web-converter]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust les assets versionnés dans index.html
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/g" public/index.html
      - name: Injecter le numéro de version dans index.html
        run: sed -i "s/__APP_VERSION__/$(cat VERSION)/g" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Supprimer les anciens déploiements Pages (garder les 10 derniers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[10:] | .[].id' | while read -r id; do
            echo "Suppression du déploiement obsolète : $id"
            gh api --method DELETE "repos/${{ github.repository }}/deployments/$id" || true
          done

      - name: Supprimer les anciens runs du workflow (garder les 10 derniers)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --workflow "deploy-pages.yml" \
            --json databaseId,createdAt --limit 100 \
            --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].databaseId' | while read -r id; do
            echo "Suppression du run obsolète : $id"
            gh run delete "$id" --repo "${{ github.repository }}" || true
          done
