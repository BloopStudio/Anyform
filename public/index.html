<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convertisseur de formats</title>
  <link rel="stylesheet" href="style.css?v=__BUILD_ID__" />
</head>
<body>
  <main class="card">
    <h1>Convertisseur de formats</h1>
    <p class="subtitle">Images, données, audio, vidéo — 100% dans le navigateur, rien à installer</p>

    <div class="controls">
      <label for="category">Type de fichier :</label>
      <select id="category">
        <option value="image">Image</option>
        <option value="data">Données</option>
        <option value="audio">Audio</option>
        <option value="video">Vidéo</option>
      </select>
    </div>

    <div class="controls">
      <label for="sourceFormat">Format d'entrée :</label>
      <select id="sourceFormat">
        <option value="svg">SVG</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
        <option value="gif">GIF</option>
        <option value="bmp">BMP</option>
        <option value="heic">HEIC</option>
      </select>
    </div>

    <div class="controls">
      <label for="format">Format de sortie :</label>
      <select id="format">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
        <option value="ico">ICO</option>
        <option value="tiff">TIFF</option>
      </select>
    </div>

    <div id="dropzone" class="dropzone">
      <p>Glisse un fichier ici ou clique pour en choisir un</p>
      <input id="fileInput" type="file" hidden />
      <p id="fileName" class="filename"></p>
    </div>

    <div id="previewRow" class="preview-row" hidden>
      <div class="preview-box">
        <span class="preview-label">Original</span>
        <img id="previewBefore" alt="Aperçu du fichier original" />
      </div>
      <div class="preview-arrow">→</div>
      <div class="preview-box">
        <span class="preview-label">Résultat</span>
        <img id="previewAfter" alt="Aperçu du fichier converti" />
      </div>
    </div>

    <div id="scaleRow" class="controls">
      <label for="scale">Échelle (pour SVG en entrée) :</label>
      <select id="scale">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="4">4x</option>
      </select>
    </div>

    <div class="controls">
      <button id="convertBtn" disabled>Convertir</button>
    </div>

    <p id="status" class="status"></p>
  </main>

  <script src="vendor/imagetracer.js?v=__BUILD_ID__"></script>
  <script src="vendor/xlsx.full.min.js?v=__BUILD_ID__"></script>
  <script src="vendor/lame.min.js?v=__BUILD_ID__"></script>
  <script src="vendor/heic2any.min.js?v=__BUILD_ID__"></script>
  <script src="vendor/utif.js?v=__BUILD_ID__"></script>
  <script src="convert.js?v=__BUILD_ID__"></script>
  <script src="data.js?v=__BUILD_ID__"></script>
  <script src="audio.js?v=__BUILD_ID__"></script>
  <script src="video.js?v=__BUILD_ID__"></script>
  <script src="app.js?v=__BUILD_ID__"></script>
</body>
</html>
